<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lentokenttä Appro</title>
  <style>
    
    @font-face {
    font-family: "Glora";
    src: url("../static/fonts/Glora_Bold.ttf") format("truetype");
    font-weight: 300;
    font-style: normal;
    }

    :root {
      --purple: #856DD9;
      --blue: #5EAECF;
      --navy: #002F6C;
      --green: #26D79F;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100vw;
      background-image: url("../static/images/background.jpeg"); 
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .start-btn {  
      position: absolute;
      top: 82%; 
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Glora';
      font-size: 1.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(180deg, var(--purple), var(--blue));
      border: 4px solid white;
      color: white;
      padding: 0.5rem 5rem;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
    }

    .start-btn:hover {
      transform: translateX(-50%) scale(1.04);
      box-shadow: 0 4px 14px rgba(133, 109, 217, 0.4);
    }

    @media (max-width: 768px) {
      .start-btn {
        top: 65%;
        font-size: 1.1rem;
        padding: 0.8rem 2.4rem;
      }
    }

    @media (max-width: 480px) {
      .start-btn {
        top: 68%;
        font-size: 1rem;
        padding: 0.7rem 2rem;
      }
    }
  </style>
</head>
<body>
  <button class="start-btn" onclick="goToLogin()">ALOITA</button>

  <script>
    function goToLogin() {
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
